[project]
name = "sensex"
version = "0.1.0"
description = "Trend research and script packages for AI-generated videos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "gradio-client>=2.7.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
sensex = "sensex.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
