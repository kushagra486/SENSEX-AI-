<title>Sensex Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a production binder. Sticky tab bar; scripts open as a slate header,
   a to-scale shot strip, then one slate row per shot with its paste-ready prompt. */
:root {
  --bg: #f1f3f7; --surface: #ffffff; --sunken: #e7ebf1; --ink: #131a26; --muted: #586377;
  --line: #d3dae5; --accent: #c2255c; --accent-ink: #ffffff;
  --tool-1: #2f6fde; --tool-2: #0e9384; --tool-3: #b7791f; --tool-4: #7c4ddb;
  --warn: #a15c00;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171d27; --sunken: #0b0e14; --ink: #e9edf4; --muted: #97a3b6;
  --line: #2a3443; --accent: #ff6f9f; --accent-ink: #1a0810;
  --tool-1: #6ea2ff; --tool-2: #3fcdbb; --tool-3: #e0a84a; --tool-4: #ab8bf5;
  --warn: #f0b354; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d27; --sunken: #0b0e14; --ink: #e9edf4; --muted: #97a3b6;
  --line: #2a3443; --accent: #ff6f9f; --accent-ink: #1a0810;
  --tool-1: #6ea2ff; --tool-2: #3fcdbb; --tool-3: #e0a84a; --tool-4: #ab8bf5;
  --warn: #f0b354; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; padding-block: 10px; }
.brand { font: 700 19px/1 var(--display); letter-spacing: -0.01em; }
.brand small { font: 400 12px var(--body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); }
nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }

main { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 28px; }
h1 { font: 700 clamp(26px, 5vw, 38px)/1.1 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--display); margin: 0; }
h3 { font: 600 15px/1.3 var(--body); margin: 0; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font: 600 11px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack.tight { gap: 6px; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.pick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pick b { font: 600 15px/1.3 var(--body); }
.pick span { font-size: 12px; color: var(--muted); }

.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 11px var(--mono); padding: 3px 8px; border-radius: 4px; background: var(--sunken); color: var(--ink); white-space: nowrap; }
.chip.tool { background: color-mix(in srgb, var(--hue) 18%, var(--surface)); box-shadow: inset 3px 0 0 var(--hue); }

.strip { display: flex; height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.strip a { flex-basis: 0; min-width: 0; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: var(--ink); text-decoration: none; background: color-mix(in srgb, var(--hue) 30%, var(--surface)); border-right: 1px solid var(--surface); overflow: hidden; }
.ruler { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--hue); margin-right: 6px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.warn { color: var(--warn); font-size: 14px; }

.shot { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--hue); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 80px; }
.slate { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font: 600 12px var(--mono); font-variant-numeric: tabular-nums; }
.slate .id { font-size: 15px; }
.slate .who { font: 400 13px var(--body); color: var(--muted); }
.prompt { position: relative; background: var(--sunken); border-radius: 6px; padding: 12px 12px 12px 12px; }
.prompt pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 13px/1.6 var(--mono); padding-right: 64px; }
.copy { position: absolute; top: 8px; right: 8px; font: 600 11px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
.copy.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cues { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 14px; }
.cues dt { font: 600 11px/1.9 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cues dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.title { min-width: 220px; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.notes h3 { margin-top: 8px; font: 700 16px var(--display); }
.empty { color: var(--muted); padding: 24px 0; }
.form { gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label { font-weight: 600; font-size: 14px; }
.small { font-size: 13px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
textarea { resize: vertical; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 600; }
button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
button.plain { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; color: var(--muted); }
button.danger { background: var(--warn); color: var(--bg); border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; }
</style>

<header class="bar"><div class="wrap gutter">
  <div class="brand">Sensex Studio<small id="built"></small></div>
  <nav id="nav" aria-label="Sections"></nav>
</div></header>
<main class="wrap gutter" id="main"></main>

<script type="application/json" id="data">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const VIEWS = [["scripts", "Scripts"], ["create", "Create"], ["series", "Series"], ["trends", "Trends"]];
const TOOLS = DATA.tools;
const toolNames = Object.keys(TOOLS);
const RANGES = { short: [15, 90], solo_drama: [60, 240], series_episode: [30, 240], long_video: [300, 1800] };
const hue = (tool) => `var(--tool-${(Math.max(0, toolNames.indexOf(tool)) % 4) + 1})`;
const label = (tool) => (TOOLS[tool] || {}).label || tool;
const clock = (s) => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const num = (n) => Number(n).toLocaleString("en-IN");
const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

let db = null, ask = null, ready = false;
let appScripts = [];
let selected = null;
let busy = null;            // text shown while Claude is writing
let notice = "";            // last error or result message on the Create view
let removing = null;        // id of the script awaiting delete confirmation
const draft = { kind: "series_episode", idea: "", language: DATA.channel.language, seconds: 60, tier: "default", change: "" };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}

/* ---------- checking a script against the tool limits (mirrors `sensex check`) ---------- */
function review(p) {
  const errors = [], warnings = [];
  const chars = Object.fromEntries(p.characters.map((c) => [c.id, c]));
  const clips = {};
  let runtime = 0, quiet = 0, longest = 0;
  for (const s of p.shots) {
    runtime += s.duration_seconds;
    const tool = TOOLS[s.tool];
    if (!tool) { errors.push(`Shot ${s.id}: unknown tool "${s.tool}". Use one of: ${toolNames.join(", ")}.`); continue; }
    clips[s.tool] = (clips[s.tool] || 0) + 1;
    if (s.duration_seconds > tool.max_clip_seconds) errors.push(`Shot ${s.id}: ${s.duration_seconds}s is longer than ${tool.label}'s ${tool.max_clip_seconds}s clip limit. Split it.`);
    if (s.dialogue && !tool.has_audio) warnings.push(`Shot ${s.id} has dialogue, but ${tool.label} makes silent clips. Voice the line separately.`);
    for (const id of s.characters) if (!chars[id]) errors.push(`Shot ${s.id}: unknown character "${id}".`);
    quiet = (s.dialogue || s.voiceover) ? 0 : quiet + s.duration_seconds;
    longest = Math.max(longest, quiet);
  }
  const credits = {}, days = {};
  for (const [t, n] of Object.entries(clips)) { credits[t] = n * TOOLS[t].credits_per_clip; days[t] = Math.ceil(credits[t] / TOOLS[t].daily_credits); }
  const daysNeeded = Math.max(0, ...Object.values(days));
  if (Math.abs(runtime - p.target_runtime_seconds) > p.target_runtime_seconds * 0.15) errors.push(`Shots add up to ${runtime}s but the target is ${p.target_runtime_seconds}s.`);
  if (daysNeeded > DATA.max_days) errors.push(`Needs ${daysNeeded} days of free credits; the limit is ${DATA.max_days}. Use fewer shots or a tool with more daily credits.`);
  const [low, high] = RANGES[p.format] || [0, 1e9];
  if (runtime < low || runtime > high) warnings.push(`${runtime}s is outside the usual ${low}-${high}s for this format.`);
  const first = p.shots[0];
  if (first.duration_seconds > 4) warnings.push(`The opening shot is ${first.duration_seconds}s. Keep it to 4s or less.`);
  if (!(first.on_screen_text || first.dialogue || first.voiceover)) warnings.push("The opening has no on-screen text or spoken line.");
  if (runtime <= 90 && runtime / p.shots.length > 7) warnings.push(`Average shot is ${(runtime / p.shots.length).toFixed(1)}s. Aim for 7s or less in short videos.`);
  if (longest > 16) warnings.push(`${longest}s pass with no dialogue or voiceover.`);
  return { errors, warnings, runtime, clips, credits, days, daysNeeded };
}

/* ---------- turning Claude's answer into a full package ---------- */
const str = (v) => (typeof v === "string" ? v : "");
function normalise(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.shots) || !raw.shots.length || !Array.isArray(raw.characters)) throw new Error("The answer was not a script. Try again.");
  const characters = raw.characters.map((c) => ({ id: str(c.id), name: str(c.name), role: str(c.role), archetype: str(c.archetype), personality: str(c.personality), voice: str(c.voice),
    visual_block: str(c.visual_block).trim(), reference_image_prompt: str(c.reference_image_prompt) || `Character reference sheet, full body, front and side view, plain grey background. ${str(c.visual_block).trim()}.` }));
  const looks = Object.fromEntries(characters.map((c) => [c.id, c.visual_block]));
  const expand = (text) => str(text).replace(/\{\{\s*([\w-]+)\s*\}\}/g, (m, id) => looks[id] || m);
  const shots = raw.shots.map((s, i) => {
    const prompt = str(s.prompt);
    const used = [...new Set([...prompt.matchAll(/\{\{\s*([\w-]+)\s*\}\}/g)].map((m) => m[1]).filter((id) => looks[id]))];
    return { id: str(s.id) || "S" + (i + 1), act: str(s.act), duration_seconds: Number(s.duration_seconds) || 0, tool: str(s.tool), characters: used, prompt: expand(prompt),
      dialogue: str(s.dialogue), voiceover: str(s.voiceover), sound: str(s.sound), on_screen_text: str(s.on_screen_text), transition: str(s.transition) || "cut" };
  });
  const story = raw.story || {}, posting = raw.posting || {}, list = (v) => (Array.isArray(v) ? v.map(str).filter(Boolean) : []);
  const fmt = RANGES[raw.format] ? raw.format : "short";
  const series = raw.series && fmt === "series_episode" ? { title: str(raw.series.title), episode_number: Number(raw.series.episode_number) || 1, season_arc: str(raw.series.season_arc), previously: str(raw.series.previously), cliffhanger: str(raw.series.cliffhanger) } : null;
  return { format: fmt, title: str(raw.title) || "Untitled", logline: str(raw.logline), platform: str(raw.platform) || DATA.channel.platforms.join(", "), aspect_ratio: ["9:16", "16:9", "1:1"].includes(raw.aspect_ratio) ? raw.aspect_ratio : "9:16",
    target_runtime_seconds: Number(raw.target_runtime_seconds) || shots.reduce((a, s) => a + s.duration_seconds, 0), trend_basis: list(raw.trend_basis), original_twist: str(raw.original_twist), series, characters,
    story: { opening_hook: str(story.opening_hook), hook_variants: list(story.hook_variants), acts: (Array.isArray(story.acts) ? story.acts : []).map((a) => ({ name: str(a.name), summary: str(a.summary) })), ending: str(story.ending) },
    shots, posting: { title: str(posting.title), title_variants: list(posting.title_variants), caption: str(posting.caption), hashtags: list(posting.hashtags), thumbnail_prompt: expand(posting.thumbnail_prompt) } };
}
// The reverse: put {{id}} back so Claude edits a compact version.
function collapse(p) {
  const copy = JSON.parse(JSON.stringify(p));
  const swap = (text) => copy.characters.reduce((t, c) => t.split(c.visual_block).join(`{{${c.id}}}`), text);
  for (const s of copy.shots) { s.prompt = swap(s.prompt); delete s.characters; }
  copy.posting.thumbnail_prompt = swap(copy.posting.thumbnail_prompt);
  for (const c of copy.characters) delete c.reference_image_prompt;
  return copy;
}

/* ---------- the instructions sent to Claude ---------- */
function brief() {
  const t = DATA.trends || {};
  const titles = (a) => ((a || {}).top_videos || []).slice(0, 12).map((v) => `- ${num(v.views)} views, ${clock(v.duration_seconds)}: ${v.title}`).join("\n");
  const toolLines = toolNames.map((n) => `- "${n}" (${TOOLS[n].label}): clips up to ${TOOLS[n].max_clip_seconds}s, ${Math.floor(TOOLS[n].daily_credits / TOOLS[n].credits_per_clip)} clips per day, ${TOOLS[n].has_audio ? "generates speech and sound" : "silent clips"}`).join("\n");
  return `You write script packages for AI-generated videos. The prompts you write get pasted into AI video tools one shot at a time.

CHANNEL
Niche: ${DATA.channel.niche}. Audience: ${DATA.channel.audience}. Platforms: ${DATA.channel.platforms.join(", ")}.

VIDEO TOOLS (the "tool" of every shot must be one of these keys)
${toolLines}
The whole video must be generable within ${DATA.max_days} days of those daily limits. Spend the scarce tools that generate speech on dialogue and key emotional beats. Put silent action on the high-volume tool, with voiceover.

WHAT IS TRENDING (scan of ${t.date || "no date"})
${(t.notes || "No written analysis.").trim().slice(0, 6000)}

Top long-form titles this week:
${titles(t.analysis)}

Top titles under four minutes:
${titles(t.shorts_analysis)}

ORIGINALITY
Trends show what works; never copy. Take a pattern and build a new premise, world and characters. Never reuse another video's title, characters or plot, and never use real people, existing franchises or copyrighted characters.

WRITING RULES
- First shot: 2 to 4 seconds, the strangest or most tense image, with on-screen text or a spoken line.
- Each character has a "visual_block": one concrete sentence fragment starting with their name (age, build, hair, a face mark, exact clothing and colours). In shot prompts and the thumbnail prompt, write {{character_id}} wherever the character appears; it is replaced by the visual_block, so never describe a character's looks any other way.
- Every prompt stands alone: start with the aspect ratio, visual style, location, time of day and lighting. One action and one camera move per shot. For tools that generate speech, put the spoken line in quotes inside the prompt.
- No shot longer than its tool's clip limit. Shot durations must add up to target_runtime_seconds.
- In short videos keep the average shot at 7 seconds or less, and never go more than 16 seconds without dialogue or voiceover.
- Keep casts small: 2 or 3 characters for anything under 3 minutes.
- Series episodes end on a cliffhanger that raises a new question.
- hook_variants and title_variants: two each, different angles, not rewordings.

Reply with only one JSON object of this shape:
{"format":"short|solo_drama|series_episode|long_video","title":"","logline":"","platform":"","aspect_ratio":"9:16","target_runtime_seconds":0,
"trend_basis":["which trend this draws on"],"original_twist":"what makes it ours",
"series":{"title":"","episode_number":1,"season_arc":"","previously":"","cliffhanger":""},
"characters":[{"id":"lowercase_id","name":"","role":"","archetype":"","personality":"","voice":"","visual_block":""}],
"story":{"opening_hook":"","hook_variants":["",""],"acts":[{"name":"","summary":""}],"ending":""},
"shots":[{"id":"S1","act":"name of an act","duration_seconds":3,"tool":"","prompt":"","dialogue":"","voiceover":"","sound":"","on_screen_text":"","transition":"cut"}],
"posting":{"title":"","title_variants":["",""],"caption":"","hashtags":["#"],"thumbnail_prompt":""}}
Use "series": null unless the format is series_episode.`;
}

function seriesList() {
  const map = new Map();
  for (const b of DATA.series) map.set(b.title, { title: b.title, season_arc: b.season_arc, characters: b.characters, episodes: b.episodes.map((e) => ({ ...e })) });
  for (const s of allScripts()) {
    const sr = s.package.series; if (!sr || !sr.title) continue;
    const entry = map.get(sr.title) || { title: sr.title, season_arc: sr.season_arc, characters: s.package.characters, episodes: [] };
    if (!entry.episodes.some((e) => e.number === sr.episode_number)) entry.episodes.push({ number: sr.episode_number, title: s.package.title, summary: s.package.logline, cliffhanger: sr.cliffhanger });
    map.set(sr.title, entry);
  }
  for (const e of map.values()) e.episodes.sort((a, b) => a.number - b.number);
  return [...map.values()];
}

function request() {
  const lines = [];
  if (draft.kind.startsWith("next:")) {
    const s = seriesList().find((x) => x.title === draft.kind.slice(5));
    const next = (s.episodes.at(-1)?.number || 0) + 1;
    lines.push(`Write episode ${next} of the existing series "${s.title}" (format series_episode).`, `Season arc: ${s.season_arc}`,
      "Episodes so far:", ...s.episodes.map((e) => `${e.number}. ${e.title}: ${e.summary} Cliffhanger: ${e.cliffhanger}`),
      "Use these characters with exactly these ids and visual_blocks (you may add one new character):", JSON.stringify(s.characters.map(({ reference_image_prompt, ...c }) => c)),
      "Pick up from the last cliffhanger and summarise it in \"previously\".");
  } else {
    lines.push(`Write a new ${draft.kind.replace("_", " ")}${draft.kind === "series_episode" ? " that is episode 1 of a new series" : ""}.`);
  }
  lines.push(`Target runtime: about ${draft.seconds} seconds. Language for dialogue, voiceover, on-screen text, title and caption: ${draft.language}. Write the visual prompts in English.`);
  lines.push(draft.idea.trim() ? `The idea to build on: ${draft.idea.trim()}` : "Choose the idea yourself from what the trend scan supports best.");
  return lines.join("\n");
}

async function generate(input, source) {
  busy = "Asking Claude…"; notice = ""; render();
  const status = (text) => { busy = text; const el = document.getElementById("status"); if (el) el.textContent = text; };
  const opts = { modelTier: draft.tier, cache: false, onText: ({ text }) => status(`Claude is writing… ${num(text.length)} characters`) };
  try {
    let pkg = normalise(await ask.json(input, opts));
    let result = review(pkg);
    if (result.errors.length) {
      status("Fixing limits the first draft broke…");
      pkg = normalise(await ask.json(`${brief()}\n\nThis script package breaks these rules:\n${result.errors.map((e) => "- " + e).join("\n")}\n\nFix them and reply with the full corrected JSON object.\n\n${JSON.stringify(collapse(pkg))}`, opts));
      result = review(pkg);
    }
    const id = `${new Date().toISOString().slice(0, 10)}-${slug(pkg.title)}-${Date.now().toString(36).slice(-4)}`;
    const entry = { id, package: pkg, created: Date.now(), source };
    if (db) await db.collection("scripts").doc(id).set({ package: pkg, created: entry.created, source });
    else appScripts = [entry, ...appScripts];
    selected = id; busy = null; draft.idea = ""; draft.change = "";
    notice = result.errors.length ? "Saved, but it still breaks a limit. See the notes at the top of the script." : "";

      invalid_json: "The answer was cut short or was not a script. Try again, or ask for a shorter video.", cancelled: "Stopped." })[e && e.code] || (e && e.message) || "Something went wrong. Try again.";

}

/* ---------- small renderers ---------- */
function inline(text) {
  const out = []; const pattern = /\*\*(.+?)\*\*|\[([^\]]+)\]\((https?:[^)]+)\)/g; let last = 0, m;
  while ((m = pattern.exec(text))) { if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] ? h("strong", {}, m[1]) : h("a", { href: m[3], target: "_blank", rel: "noopener" }, m[2])); last = pattern.lastIndex; }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function markdown(text) {
  const box = h("div", { class: "notes" }); let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim(); const bullet = line.match(/^(?:-|\d+\.)\s+(.*)/);
    if (bullet) { if (!list) { list = h("ul"); box.append(list); } list.append(h("li", {}, inline(bullet[1]))); continue; }
    list = null; if (!line) continue;
    if (line.startsWith("### ")) box.append(h("h3", {}, line.slice(4))); else if (!line.startsWith("## ")) box.append(h("p", {}, inline(line)));
  }
  return box;
}
function copyBlock(text) {
  const pre = h("pre", {}, text);
  const button = h("button", { class: "copy", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const range = document.createRange(); range.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); button.textContent = "Selected"; return; }
    button.textContent = "Copied"; button.classList.add("done");
    setTimeout(() => { button.textContent = "Copy"; button.classList.remove("done"); }, 1400);
  } }, "Copy");
  return h("div", { class: "prompt" }, pre, button);
}
function table(headers, rows) {
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, headers.map(([text, cls]) => h("th", { class: cls }, text)))),
    h("tbody", {}, rows.map((cells) => h("tr", {}, cells.map((cell, i) => h("td", { class: headers[i][1] }, cell)))))));
}
function sharedStyle(p) {
  let prefix = p.shots[0].prompt;
  for (const s of p.shots) while (!s.prompt.startsWith(prefix)) prefix = prefix.slice(0, -1);
  const cut = prefix.lastIndexOf(". ");
  return cut > 0 ? prefix.slice(0, cut + 1).trim() : "";
}
function episodePrompt(p) {
  const style = sharedStyle(p), total = p.shots.reduce((a, s) => a + s.duration_seconds, 0);
  const lines = [`Create one ${clock(total)} video in ${p.aspect_ratio} format: "${p.title}".`, `STORY: ${p.logline}`];
  if (p.series) lines.push(`This is episode ${p.series.episode_number} of the series "${p.series.title}". It must end on this cliffhanger: ${p.series.cliffhanger}`);
  if (style) lines.push(`LOOK (identical in every shot): ${style}`);
  lines.push("CHARACTERS (each must look exactly the same in every shot they appear in):");
  for (const c of p.characters) lines.push(`- ${c.visual_block}. Role: ${c.role}. Personality: ${c.personality}. Voice: ${c.voice}.`);
  lines.push(`SHOTS, in order (${p.shots.length} shots; keep each to its exact length):`);
  let at = 0;
  p.shots.forEach((s, i) => {
    let action = style && s.prompt.startsWith(style) ? s.prompt.slice(style.length).trim() : s.prompt;
    for (const c of p.characters) action = action.split(c.visual_block).join(c.name);
    const parts = [`${i + 1}. [${clock(at)}-${clock(at + s.duration_seconds)}, ${s.duration_seconds}s] ${action}`];
    if (s.dialogue) parts.push(`Spoken on screen, lips in sync: ${s.dialogue}`);
    if (s.voiceover) parts.push(`Voiceover (not lip-synced): ${s.voiceover}`);
    if (s.sound) parts.push(`Sound: ${s.sound}.`);
    if (s.on_screen_text) parts.push(`On-screen caption: "${s.on_screen_text}"`);
    parts.push(`Transition into this shot: ${s.transition}.`);
    lines.push(parts.join(" ")); at += s.duration_seconds;
  });
  lines.push("EDITING: Cut on action with no fades unless a shot says otherwise. Captions are bold white with a black outline in the upper third, shown for the whole shot they belong to; add no other text, logos or watermarks. Keep colour, lighting and character looks continuous from shot to shot. Voices sit above music and sound effects. End on the last shot's image, then cut to black.");
  return lines.join("\n\n");
}
const allScripts = () => [...[...appScripts].sort((a, b) => b.created - a.created), ...DATA.scripts.map((s) => ({ id: s.folder, package: s.package, source: "repo" }))];

/* ---------- views ---------- */

    h("b", {}, s.package.title),

        h("span", { class: "chip tool" }, label(s.tool)), h("span", { class: "who" }, [s.act, ...s.characters.map((c) => names[c] || c)].filter(Boolean).join(" · "))),

    at += s.duration_seconds;
  }
  const manage = h("section", {}, h("h2", {}, "Change this script"),
    ask ? h("div", { class: "panel" },

      h("div", { class: "row" },
        h("button", { class: "primary", type: "button", disabled: !!busy, onclick: () => { if (!draft.change.trim()) return;
          const change = draft.change.trim();
          generate(`${brief()}\n\nHere is an existing script package. Apply this change and reply with the full updated JSON object, keeping everything else:\n${change}\n\n${JSON.stringify(collapse(p))}`, "app"); } }, "Save as a new version"),
        h("span", { class: "muted", id: "status" }, busy || "Uses your Claude plan. The original stays as it is.")))
      : h("p", { class: "muted" }, ready ? "Changing scripts needs Claude access, which this view does not have." : "Connecting to Claude…"),
    entry.source !== "repo" ? h("div", { class: "row" },
      removing === entry.id
        ? [h("button", { class: "danger", type: "button", onclick: async () => { removing = null; if (db) await db.collection("scripts").doc(entry.id).delete().catch(() => {}); else appScripts = appScripts.filter((s) => s.id !== entry.id); selected = null; render(); } }, "Yes, delete it"),
           h("button", { type: "button", class: "plain", onclick: () => { removing = null; render(); } }, "Keep it")]
        : h("button", { type: "button", class: "plain", onclick: () => { removing = entry.id; render(); } }, "Delete this script")) : null);

  return [
    h("section", {}, h("div", { class: "eyebrow" }, "Scripts"), picker),
    h("section", {}, h("h1", {}, p.title), h("p", { class: "muted" }, p.logline),
      h("div", { class: "meta" }, [p.format.replace("_", " "), p.aspect_ratio, clock(r.runtime), `${p.shots.length} shots`, p.platform].map((t) => h("span", { class: "chip" }, t))),
      r.errors.map((w) => h("p", { class: "warn" }, "Breaks a limit: " + w)), r.warnings.map((w) => h("p", { class: "warn" }, "Check: " + w))),
    h("section", {}, h("div", { class: "stack tight" }, strip, h("div", { class: "ruler" }, h("span", {}, "0:00"), h("span", {}, clock(r.runtime / 2)), h("span", {}, clock(r.runtime)))),
      h("div", { class: "legend" }, Object.keys(r.clips).map((t) => h("span", { style: `--hue:${hue(t)}` }, h("i"), `${label(t)}: ${r.clips[t]} clips, ${r.credits[t]} credits, ${r.days[t]} day${r.days[t] === 1 ? "" : "s"}`)))),
    h("section", {}, h("h2", {}, "Whole-episode prompt"),

    h("section", {}, h("h2", {}, "Shots"), h("p", { class: "muted" }, "Generate in this order and paste each prompt exactly as written. Save each clip as its shot name, for example S1.mp4."), shots),

}

function createView() {
  const series = seriesList();
  const kinds = [["series_episode", "New series, episode 1"], ["short", "One-off short"], ["solo_drama", "Solo drama"], ["long_video", "Long video"],
    ...series.map((s) => ["next:" + s.title, `Next episode of ${s.title}`])];
  const field = (id, text, control, hint) => h("div", { class: "field" }, h("label", { for: id }, text), control, hint ? h("span", { class: "muted small" }, hint) : null);
  const defaults = { series_episode: 60, short: 40, solo_drama: 90, long_video: 300 };
  const form = h("form", { class: "panel form", onsubmit: (e) => { e.preventDefault(); if (!busy && ask) generate(`${brief()}\n\nTHE JOB\n${request()}`, "app"); } },
    field("kind", "What to write", h("select", { id: "kind", onchange: (e) => { draft.kind = e.target.value; draft.seconds = defaults[draft.kind] || 60; render(); } },
      kinds.map(([v, t]) => h("option", { value: v, selected: v === draft.kind }, t)))),
    field("idea", "Your idea", h("textarea", { id: "idea", rows: "4", placeholder: "Optional. A premise, a character, a scene you want in it.", value: draft.idea, oninput: (e) => { draft.idea = e.target.value; } }),
      "Leave empty and Claude picks the idea the trend scan supports best."),
    h("div", { class: "two" },
      field("language", "Language", h("input", { id: "language", type: "text", value: draft.language, oninput: (e) => { draft.language = e.target.value; } }), "For dialogue, on-screen text, title and caption."),
      field("seconds", "Length in seconds", h("input", { id: "seconds", type: "number", min: "15", max: "1800", value: String(draft.seconds), oninput: (e) => { draft.seconds = Number(e.target.value) || 60; } }),
        "Free video credits make anything over about 3 minutes a multi-day job."),
      field("tier", "Writing quality", h("select", { id: "tier", onchange: (e) => { draft.tier = e.target.value; } },
        [["default", "Balanced"], ["complex", "Best, slower, uses more of your plan"]].map(([v, t]) => h("option", { value: v, selected: v === draft.tier }, t))))),
    h("div", { class: "row" }, h("button", { class: "primary", type: "submit", disabled: !!busy || !ask }, busy ? "Writing…" : "Write the script"),
      h("span", { class: "muted", id: "status", role: "status" }, busy || (ask ? "Takes a minute or two. Uses your Claude plan." : ready ? "Writing needs Claude access, which this view does not have. Open the page on claude.ai while signed in." : "Connecting to Claude…"))),

    h("p", { class: "muted" }, `Claude writes it from the ${DATA.trends ? DATA.trends.date : "latest"} trend scan, checks it against your video tools' clip lengths and daily credits, and saves it to Scripts.`), form)];
}

function seriesView() {
  const all = seriesList();
  if (!all.length) return [h("p", { class: "empty" }, "No series yet.")];
  return all.map((b) => h("section", {}, h("h1", {}, b.title), h("p", { class: "muted" }, b.season_arc),
    h("div", { class: "row" }, h("button", { class: "primary", type: "button", onclick: () => { draft.kind = "next:" + b.title; draft.seconds = 60; location.hash = "create"; } }, "Write the next episode")),
    h("h2", {}, "Episodes"), table([["Ep", "num"], ["Title", "title"], ["Summary", ""], ["Cliffhanger", ""]], b.episodes.map((e) => [String(e.number), e.title, e.summary, e.cliffhanger])),
    h("h2", {}, "Fixed characters"), h("div", { class: "two" }, b.characters.map((c) => h("div", { class: "panel" }, h("h3", {}, `${c.name} · ${c.role}`), h("p", { class: "muted" }, c.personality), copyBlock(c.visual_block))))));

function videoTable(videos) {
  return table([["Views", "num"], ["Length", "num"], ["Title", "title"], ["Channel", ""]],
    videos.slice(0, 15).map((v) => [num(v.views), clock(v.duration_seconds), h("a", { href: v.url, target: "_blank", rel: "noopener" }, v.title), v.channel]));
}
function trendsView() {
  const t = DATA.trends;
  if (!t) return [h("p", { class: "empty" }, "No trend report yet.")];
  const a = t.analysis, s = t.shorts_analysis || {};
  const out = [h("section", {}, h("div", { class: "eyebrow" }, `Trend report · ${t.date}`), h("h1", {}, t.niche),
    h("p", { class: "muted" }, `YouTube videos uploaded in the last ${t.window}: ${num(a.video_count || 0)} long-form and ${num(s.video_count || 0)} under four minutes. Views are as of the scan. A new scan is run from the Claude session.`))];
  if (t.notes) out.push(h("section", {}, h("h2", {}, "What this means for us"), h("div", { class: "panel" }, markdown(t.notes))));
  if (a.video_count) {
    out.push(h("section", {}, h("h2", {}, "Which searches are hottest"), table([["Search", ""], ["Median views, long", "num"], ["Median views, short", "num"]],
      a.queries.map((q) => [q.query, num(q.median_views), num(((s.queries || []).find((x) => x.query === q.query) || {}).median_views || 0)]))));
    out.push(h("section", {}, h("h2", {}, "Title habits"), table([["Habit", ""], ["Share, long", "num"], ["Median views", "num"], ["Share, short", "num"], ["Median views", "num"]],
      a.title_patterns.map((p) => { const o = (s.title_patterns || []).find((x) => x.pattern === p.pattern) || {};
        return [p.pattern, Math.round(p.share * 100) + "%", num(p.median_views), o.share ? Math.round(o.share * 100) + "%" : "–", o.median_views ? num(o.median_views) : "–"]; }))));
    out.push(h("section", {}, h("h2", {}, "Top long-form videos"), videoTable(a.top_videos)));
  }
  if (s.video_count) out.push(h("section", {}, h("h2", {}, "Top videos under four minutes"), videoTable(s.top_videos)));
  if ((t.rising_words || []).length) out.push(h("section", {}, h("h2", {}, `Rising since ${t.compared_with}`),
    h("div", { class: "meta" }, t.rising_words.map((w) => h("span", { class: "chip" }, `${w.word} ${w.before}→${w.now}`)))));
  return out;
}

function currentView() { return VIEWS.some(([id]) => id === location.hash.slice(1)) ? location.hash.slice(1) : "scripts"; }
function render() {
  const view = currentView();
  document.getElementById("nav").replaceChildren(...VIEWS.map(([id, text]) => h("button", { type: "button", "aria-current": id === view ? "page" : null, onclick: () => { location.hash = id; } }, text)));
  document.getElementById("main").replaceChildren(...({ scripts: scriptView, create: createView, series: seriesView, trends: trendsView })[view]().filter(Boolean));
}
document.getElementById("built").textContent = "trends and repo scripts as of " + DATA.built;
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
render();

(async () => {
  const use = (name) => (window.claude && window.claude.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
  [db, ask] = await Promise.all([use("db"), use("sample")]);
  ready = true;
  if (db) db.collection("scripts").onSnapshot((snap) => {
    appScripts = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((s) => s.package && Array.isArray(s.package.shots));
    // Typing in a form must not be interrupted by a list refresh.
    const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName);
    if (!typing && !busy) render();
  }, () => {});
  if (!busy) { const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName); if (!typing) render(); }
})();
